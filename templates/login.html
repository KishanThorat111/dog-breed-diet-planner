<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Dog Breed Identifier</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-card{
    width:420px;
    padding:35px;
    border-radius:20px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    transition:0.3s;
}

.login-card:hover{
    transform: translateY(-5px);
}

.title{
    text-align:center;
    font-weight:600;
    margin-bottom:25px;
    color:#333;
}

.form-label{
    font-weight:500;
}

.form-control{
    border-radius:10px;
    padding:10px;
}

.form-control:focus{
    border-color:#ff7b54;
    box-shadow:0 0 5px rgba(255,123,84,0.5);
}

.btn-login{
    background:#ff7b54;
    border:none;
    padding:10px;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.btn-login:hover{
    background:#ff5722;
    transform:scale(1.03);
}

.register-link{
    text-align:center;
    margin-top:15px;
}

.register-link a{
    text-decoration:none;
    color:#ff5722;
    font-weight:500;
}

.register-link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-card">

<h2 class="title">🐶 Dog Breed Identifier Login</h2>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" placeholder="Enter Email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" placeholder="Enter Password" required>
</div>

<button type="submit" class="btn btn-login w-100">Login</button>

</form>

<div class="register-link">
<small>Don't have an account?</small><br>
<a href="{{ url_for('auth.register') }}">Register Here</a>
<a href="{{ url_for('admin.admin_login') }}">Admin Login</a>
</div>

</div>

</body>
</html>
