<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Professional Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins', sans-serif;
            background:#f4f6fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .admin-box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#2c3e50;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:#4a6cf7;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#2f54eb;
        }

        .error{
            color:red;
            margin-top:10px;
        }

        .back{
            margin-top:15px;
            display:block;
            text-decoration:none;
            color:#4a6cf7;
        }

    </style>

</head>

<body>

<div class="admin-box">

<h2>Admin Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Admin Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

{% if message %}
<p class="error">{{ message }}</p>
{% endif %}

<a href="{{ url_for('login') }}" class="back">← Back to User Login</a>

</div>

</body>
</html>
